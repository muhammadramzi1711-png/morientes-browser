<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><link rel="stylesheet" href="chrome.css"><title>Morientes</title></head><body>
<header class="toolbar" id="titlebar" aria-label="Navigasi browser"><div class="toolbar-left"><div class="traffic"><button class="light red" data-window="close" title="Tutup browser" aria-label="Tutup browser"></button><button class="light yellow" data-window="minimize" title="Minimalkan" aria-label="Minimalkan"></button><button class="light green" data-window="maximize" title="Perbesar / pulihkan" aria-label="Perbesar / pulihkan"></button></div><button class="icon-button" data-panel="bookmarks" title="Bookmark · Ctrl+B" aria-label="Buka bookmark" data-icon="sidebar"></button><div class="nav-buttons"><button id="back" class="icon-button" title="Kembali · Alt+←" aria-label="Kembali" data-icon="back"></button><button id="forward" class="icon-button" title="Maju · Alt+→" aria-label="Maju" data-icon="forward"></button></div></div>
<form id="addressForm" class="address-box"><span id="protocol" class="protocol" data-icon="globe"></span><input id="address" type="text" autocomplete="off" spellcheck="false" aria-label="Alamat website atau pencarian" placeholder="Cari atau masukkan nama situs web"><button id="reload" type="button" class="icon-button" title="Muat ulang · Ctrl+R" aria-label="Muat ulang" data-icon="reload"></button></form>
<div class="utility-buttons"><button id="home" class="icon-button" title="Halaman awal" aria-label="Halaman awal" data-icon="home"></button><button class="icon-button" data-panel="downloads" title="Unduhan · Ctrl+J" aria-label="Buka unduhan" data-icon="download"></button><button id="bookmark" class="icon-button bookmark" title="Tambahkan bookmark · Ctrl+D" aria-label="Tambahkan bookmark" data-icon="star"></button><button class="icon-button" data-panel="history" title="Riwayat · Ctrl+H" aria-label="Buka riwayat" data-icon="history"></button><button class="icon-button" data-panel="settings" title="Pengaturan" aria-label="Buka pengaturan" data-icon="menu"></button></div><div class="toast" id="toast" role="status" aria-live="polite"></div><div class="load-line" id="loadLine"></div></header>
<div class="tabbar"><div class="tabs" id="tabs" role="tablist" aria-label="Tab browser"></div><button class="icon-button new-tab" id="newTab" title="Tab baru · Ctrl+T" aria-label="Buka tab baru" data-icon="plus"></button><span class="tab-counter" id="tabCounter"></span></div>
<script src="icons.js"></script><script src="chrome.js"></script></body></html>
